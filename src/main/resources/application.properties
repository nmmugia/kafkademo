# PostgreSQL Configuration
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=your_username
quarkus.datasource.password=your_password
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/insurance_db

# Kafka Configuration
mp.messaging.incoming.policy-consumer.connector=smallrye-kafka
mp.messaging.incoming.policy-consumer.topic=insurance-policy
mp.messaging.incoming.policy-consumer.group.id=insurance-group
mp.messaging.outgoing.policy-producer.connector=smallrye-kafka
mp.messaging.outgoing.policy-producer.topic=insurance-policy-updates

# Redis Configuration
quarkus.redis.hosts=redis://localhost:6379