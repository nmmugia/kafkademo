# Flyway & Datasource
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${QUARKUS_DATASOURCE_USERNAME:insurance_user}
quarkus.datasource.password=${QUARKUS_DATASOURCE_PASSWORD:insurance_pass}
quarkus.datasource.jdbc.url=${QUARKUS_DATASOURCE_JDBC_URL:jdbc:postgresql://postgres:5432/insurance_db}
quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=true
quarkus.log.category."org.hibernate.SQL".level=DEBUG

# Kafka Outbound (Publishing)
mp.messaging.outgoing.policy-events-out.connector=smallrye-kafka
mp.messaging.outgoing.policy-events-out.topic=policy-events
mp.messaging.outgoing.policy-events-out.bootstrap.servers=${QUARKUS_KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
mp.messaging.outgoing.policy-events-out.value.serializer=org.apache.kafka.common.serialization.StringSerializer

# Kafka Inbound (Consuming)
mp.messaging.incoming.policy-consumer.connector=smallrye-kafka
mp.messaging.incoming.policy-consumer.topic=policy-consumer
mp.messaging.incoming.policy-consumer.bootstrap.servers=${QUARKUS_KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
mp.messaging.incoming.policy-consumer.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.policy-consumer.auto.offset.reset=earliest
mp.messaging.outgoing.policy-events-out.value.serializer=org.apache.kafka.common.serialization.StringSerializer


# Redis config
quarkus.redis.hosts=${QUARKUS_REDIS_HOSTS:redis://redis:6379}
