# Datasource config
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${QUARKUS_DATASOURCE_USERNAME:insurance_user}
quarkus.datasource.password=${QUARKUS_DATASOURCE_PASSWORD:insurance_pass}
quarkus.datasource.jdbc.url=${QUARKUS_DATASOURCE_JDBC_URL:jdbc:postgresql://localhost:5432/insurance_db}
quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=true
quarkus.log.category."org.hibernate.SQL".level=DEBUG
# Redis config
quarkus.redis.hosts=${QUARKUS_REDIS_HOSTS:redis://localhost:6379}